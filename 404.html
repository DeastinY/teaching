<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Not Found</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 4rem 1rem; }
  a { color: inherit; }
</style>
</head>
<body>
<div id="fallback">
  <h1>404 — Page Not Found</h1>
  <p><a href="/">Go back home</a></p>
</div>
<script>
  // GitHub Pages only serves a single root-level 404.html for any unmatched
  // path, so client-side-routed apps living in a subfolder (like the Slidev
  // deck below) need their real app shell fetched in here rather than relying
  // on their own nested 404.html, which GitHub Pages never actually serves.
  (async () => {
    if (location.pathname.startsWith("/version-control-for-researchers/")) {
      const res = await fetch("/version-control-for-researchers/404.html");
      if (res.ok) {
        document.open();
        document.write(await res.text());
        document.close();
      }
    }
  })();
</script>
</body>
</html>
