<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Richard Polzin</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120e" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script>
  // GitHub Pages only serves a single root-level 404.html for any unmatched
  // path, so client-side-routed apps living in a subfolder (like the Slidev
  // deck) need their real app shell fetched in here rather than relying on
  // their own nested 404.html, which GitHub Pages never actually serves.
  // The page stays hidden on those routes so it does not flash before the deck.
  var DECK = "/version-control-for-researchers/";
  if (location.pathname.indexOf(DECK) === 0) document.documentElement.className = "deck-route";
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* the palette is a copy of the homepage's, light and dark, like blog.css */
  :root{
    --bg:#faf8f5; --bg-warm:#f4f0ea; --ink:#17150f; --ink-2:#4f4a42; --ink-3:#6b6259;
    --line:#e5ded4; --accent:#9d4a35; --accent-lo:#f2e6e0;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14120e; --bg-warm:#1c1914; --ink:#efe9df; --ink-2:#c8c0b4; --ink-3:#a0978a;
      --line:#2f2a22; --accent:#e3917b; --accent-lo:#3a241c;
    }
  }
  .deck-route body{ visibility:hidden; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100svh; display:grid; place-items:center;
    background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:clamp(1rem,.96rem + .18vw,1.14rem); line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  main{ width:min(40rem, 100% - 2.5rem); padding-block:3rem; }
  .trace-wrap{ position:relative; margin:0 0 2.2rem; }
  .trace{ display:block; width:100%; height:auto; overflow:visible; }
  .trace .beat{ fill:none; stroke:var(--ink); stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; }
  .trace .lost{ fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:3 6; }
  /* HTML rather than SVG text, so it stays readable when the drawing shrinks */
  .lost-label{
    position:absolute; right:0; bottom:calc(16.4% + .45rem);
    font-size:.7rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
  }
  .code{
    margin:0 0 .9rem; font-size:.78rem; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--accent);
  }
  h1{
    margin:0 0 1rem; font-family:'Fraunces',Georgia,serif; font-weight:300;
    font-size:clamp(2.2rem,1.6rem + 2.6vw,3.6rem); line-height:1.04; letter-spacing:-.024em;
  }
  p{ margin:0; color:var(--ink-2); max-width:44ch; }
  nav{ display:flex; flex-wrap:wrap; gap:.6rem; margin-top:2rem; }
  nav a{
    padding:.5rem 1rem; border:1px solid var(--line); border-radius:99px;
    font-size:.9rem; text-decoration:none; color:var(--ink-2); transition:border-color .2s,color .2s;
  }
  nav a:hover{ border-color:var(--accent); color:var(--accent); }
  nav a.home{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
  nav a.home:hover{ background:var(--accent); border-color:var(--accent); color:var(--bg); }
  :focus-visible{ outline:2.5px solid var(--accent); outline-offset:3px; border-radius:99px; }
</style>
</head>
<body>

  <p class="code">404 · Page not found</p>
  <h1>This page has lost its signal.</h1>
  <p>The address may be mistyped, or the page has moved since the link was made. Everything that still exists is a step away.</p>
  <nav aria-label="Ways back">
    <a class="home" href="/">The homepage</a>
    <a href="/blog/">Writing</a>
    <a href="/#workshops">Workshops</a>
    <a href="/#contact">Get in touch</a>
  </nav>
</main>
<script>
  (async () => {
    if (location.pathname.indexOf(DECK) !== 0) return;
    try {
      const res = await fetch(DECK + "404.html");
      if (res.ok) {
        document.open();
        document.write(await res.text());
        document.close();
        return;
      }
    } catch (e) {}
    document.documentElement.className = "";   // no deck shell: show this page after all
  })();
</script>
</body>
</html>
